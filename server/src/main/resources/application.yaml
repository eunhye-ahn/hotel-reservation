spring:
  application:
    name: reservation-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 86400000

mybatis:
  #xml 위치(sql이 저장된)
  mapper-locations: classpath:mapper/*.xml
  #칼럼명의 aliases 위치 설정
  type-aliases-package: com.hotel.hotel.domain, com.hotel.hotel.dto, com.hotel.admin.dto
  #snake-case(DB) -> camel-case(Java) 자동매핑 설정
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
psp:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
app:
  google-redirect-url: ${GOOGLE_REDIRECT_URL}
server:
  port: 8080