services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hotel-postgresql:5432/hotel_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on:
      - hotel-postgresql
      - redis
      - elasticsearch
    networks:
      - server-network

  hotel-postgresql:
    image: postgres:17
    container_name: hotel-postgresql
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - hotel-postgresql-data:/var/lib/postgresql/data
    networks:
      - server-network

  redis:
    image: redis:7.4
    container_name: hotel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - server-network

  elasticsearch:
    image: elasticsearch:8.19.0
    container_name: hotel-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    command: >
      bash -c "
      bin/elasticsearch-plugin install analysis-nori --batch &&
      bin/elasticsearch"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - server-network

  kibana:
    image: kibana:8.19.0
    container_name: hotel-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - server-network

  nginx:
    image: aneunhye0416/hotel-nginx:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    container_name: hotel-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - server-network

  certbot:
    image: certbot/certbot
    container_name: hotel-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - server-network

volumes:
  hotel-postgresql-data:
  redis-data:
  es-data:

networks:
  server-network:
