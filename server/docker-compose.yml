services:
  hotel-postgresql:
    image: postgres:17
    container_name: hotel-postgresql
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: ${SPRING_DB_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - hotel-postgresql-data:/var/lib/postgresql/data
    networks:
      - server-network

  redis:
    image: redis:7.4
    container_name: hotel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - server-network

  elasticsearch:
    image: elasticsearch:8.19.0
    container_name: hotel-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    command: >
      bash -c "
      bin/elasticsearch-plugin install analysis-nori --batch &&
      bin/elasticsearch"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - server-network

  kibana:
    image: kibana:8.19.0
    container_name: hotel-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - server-network
volumes:
  hotel-postgresql-data:
  redis-data:
  es-data:

networks:
  server-network:
    name: server-network
