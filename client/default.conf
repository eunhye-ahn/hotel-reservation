server {
    #80번 포트 HTTP 요청 처리
    listen 80;
    server_name api.stayn.store;

    # certbot 인증용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 외 모든 요청은 http -> https로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stayn.store www.stayn.store;

    ssl_certificate     /etc/letsencrypt/live/stayn.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stayn.store/privkey.pem;


    #/api/로 시작하는 요청은 정적파일이 아니라 백엔드로 전달
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }dljfvcsd;l

    location /oauth2/ {
        proxy_pass http://app:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://app:8080/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}