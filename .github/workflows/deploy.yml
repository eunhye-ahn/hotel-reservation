name: Deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        working-directory: ./client
        run: |
          npm ci
          npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::811391286840:role/github-actions-deploy-role
          aws-region: ap-northeast-2
      - name: Sync to S3
        working-directory: ./client
        run: aws s3 sync ./dist s3://stayn-store-frontend --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3RY11CVDOUZBS --paths "/*"
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::811391286840:role/github-actions-deploy-role
          aws-region: ap-northeast-2
      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0980241e2e866405d" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend from GitHub Actions" \
            --parameters commands='[
              "cd /home/ubuntu/hotel-reservation",
              "git pull",
              "cd server",
              "docker compose -f docker-compose.yml -f docker-compose-deploy.yml build app --no-cache",
              "docker compose -f docker-compose.yml -f docker-compose-deploy.yml up -d --force-recreate app"
            ]'
